---
# Actions are SHA-pinned, so without an updater they stay pinned to
# whatever was current the day they were added. This is what keeps the
# pins honest.
version: 2
updates:
  - package-ecosystem: github-actions
    target-branch: main
    directory: "/"
    schedule:
      interval: weekly
    # The github-actions ecosystem supports only default-days. The
    # semver-*-days settings are not available for it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 100
    commit-message:
      prefix: "ci"
    groups:
      security-all:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    target-branch: main
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      semver-patch-days: 2
      semver-minor-days: 7
      semver-major-days: 14
      default-days: 7
    open-pull-requests-limit: 100
    commit-message:
      prefix: "deps"
    groups:
      security-all:
        applies-to: security-updates
        patterns: ["*"]
      gomod:
        patterns: ["*"]
