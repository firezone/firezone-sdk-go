[settings]
auto_install = false

[env]
GOFLAGS = "-mod=readonly"

[tasks.fmt]
description = "Format Go code"
run = "gofmt -w -s $(find . -name '*.go')"

[tasks.fmt-check]
description = "Check Go formatting (CI check)"
run = """
out=$(gofmt -l -s $(find . -name '*.go') 2>/dev/null)
if [ -n "$out" ]; then echo "$out"; exit 1; fi
"""

[tasks.vet]
description = "go vet (CI check)"
# The second pass compiles the //go:build integration files, which the
# untagged build skips entirely - without it they rot silently.
run = """
go vet ./...
go vet -tags=integration ./...
go vet -tags=spec ./...
"""

[tasks.lint]
description = "golangci-lint (CI check)"
run = "golangci-lint run ./..."

[tasks.test]
description = "go test (unit tests only, no real server needed)"
run = "go test ./... -race -count=1"

[tasks.test-acceptance]
description = "Run integration tests against a real local dev server (requires FIREZONE_ENDPOINT/FIREZONE_TOKEN)"
run = '''
missing=""
[ -z "$FIREZONE_ENDPOINT" ] && missing="$missing FIREZONE_ENDPOINT"
[ -z "$FIREZONE_TOKEN" ] && missing="$missing FIREZONE_TOKEN"
if [ -n "$missing" ]; then
  {
    echo "acceptance tests need a portal to talk to; unset:$missing"
    echo
    echo '  cd /path/to/firezone/elixir && mix phx.server   # in one terminal'
    echo '  token=$(MIX_ENV=dev mix run --no-start script/seed_api_client_token.exs | tail -1)'
    echo '  export FIREZONE_ENDPOINT=https://localhost:13001'
    echo '  export FIREZONE_TOKEN="$token"'
    echo '  export FIREZONE_CA_CERT=/path/to/firezone/elixir/priv/cert/selfsigned.pem'
    echo
    echo "Export these in the same shell you run this task from."
    echo "See the README's Testing section."
  } >&2
  exit 1
fi
# -count=1 disables Go's test cache.
go test -tags=integration ./... -run Integration -v -count=1
'''

# The oldest Go this SDK claims to support, per the `go` directive in
# go.mod. Kept here so `mise run test-floor` and CI use one source of
# truth; bump both together.
[tasks.test-floor]
description = "Build + test against the oldest supported Go (the go.mod floor)"
run = """
floor="go1.22.12"
GOTOOLCHAIN=$floor go build ./...
GOTOOLCHAIN=$floor go vet ./...
# No -race here: the `test` task already covers that on the current
# toolchain. This run only has to prove the floor still compiles and
# behaves.
GOTOOLCHAIN=$floor go test ./... -count=1
"""

# Checks every JSON struct tag against Firezone's published OpenAPI
# spec. Unit tests can't catch a misspelled field - they assert against
# fixtures written by the same hand as the tag - so this is the only
# thing that verifies what the server actually sends.
#
# Runs against the spec vendored at testdata/openapi.json, so it needs
# no monorepo checkout and behaves identically here and in CI. Check
# against an unreleased spec with:
#   FIREZONE_OPENAPI=/path/to/openapi.json mise run spec-check
[tasks.spec-check]
description = "Check struct tags against the vendored OpenAPI spec"
run = "go test -tags=spec ./... -run TestSpec -count=1 -v"

# Refreshes the vendored spec from a local monorepo checkout. The
# resulting diff is the set of API changes this SDK hasn't accounted for
# yet, so it belongs in the same PR as the code that responds to it -
# never as a drive-by "update the fixture" commit to make CI green.
[tasks.spec-update]
description = "Refresh testdata/openapi.json from a firezone monorepo checkout (needs FIREZONE_MONOREPO)"
run = """
if [ -z "$FIREZONE_MONOREPO" ]; then
  echo "set FIREZONE_MONOREPO=/path/to/firezone (the monorepo checkout)" >&2
  exit 1
fi
src="$FIREZONE_MONOREPO/elixir/priv/static/openapi.json"
if [ ! -f "$src" ]; then
  echo "no spec at $src" >&2
  exit 1
fi
cp "$src" testdata/openapi.json
echo "updated testdata/openapi.json from $src"
git --no-pager diff --stat -- testdata/openapi.json
"""

[tasks.vuln]
description = "govulncheck (CI check)"
run = "govulncheck ./..."

[tasks.build]
description = "Build (CI check)"
run = "go build ./..."

[tasks.check]
description = "Run all CI static analysis + unit test checks (matches CI)"
depends = ["fmt-check", "vet", "lint", "test", "spec-check", "vuln", "build"]
